[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cortexm"
version = "0.5.2"
description = "Deterministic agent memory. 96 bytes per fact. Zero LLM at ingest."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Context-M Contributors" }]
keywords = [
    "memory", "agents", "llm", "neuro-symbolic", "vsa", "hrr", "hdc",
    "knowledge-graph", "temporal", "provenance", "mcp", "edge", "rag",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
blake3 = ["blake3>=1.0"]
crypto = ["cryptography>=42.0"]
test = ["pytest>=7"]

[project.scripts]
cortexm = "cortexm.cli:main"

[project.urls]
Homepage = "https://github.com/ssmurfgg04-gif/context-m"

[tool.setuptools]
py-modules = ["context_m"]

[tool.setuptools.packages.find]
include = ["cortexm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
