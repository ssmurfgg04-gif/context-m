[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cortexm"
version = "0.6.4"
description = "Context-M: deterministic, auditable, zero-cost memory for AI agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Context-M Team", email = "dev@context-m.ai"}
]
keywords = ["memory", "ai", "agents", "deterministic", "audit", "zk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24.0",
    "cryptography>=41.0.0",
    "fastecdsa>=2.3.0",
]

[project.optional-dependencies]
blake3 = ["blake3>=0.3.0"]
crypto = ["cryptography>=41.0.0"]
# v0.6.4: marisa-trie moved from hard deps to optional — the production
# query-rewrite path uses the pure-dict bridge/fst.py; bridge/fst_real.py
# (the only marisa consumer) is an opt-in accelerated variant.
fst = ["marisa-trie>=1.2.0"]
test = ["pytest>=7.0", "pytest-cov>=4.0"]
all = [
    "blake3>=0.3.0",
    "cryptography>=41.0.0",
    "fastecdsa>=2.3.0",
    "marisa-trie>=1.2.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
cortexm = "cortexm.cli:main"

[project.urls]
Homepage = "https://github.com/ssmurfgg04-gif/context-m"
Documentation = "https://github.com/ssmurfgg04-gif/context-m#readme"
Repository = "https://github.com/ssmurfgg04-gif/context-m"
Issues = "https://github.com/ssmurfgg04-gif/context-m/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["cortexm*"]
exclude = ["tests*", "benchmarks*", "scripts*", "skills*", "context_m*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
