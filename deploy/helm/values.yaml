# Default values for the context-m Helm chart.

image:
  repository: context-m
  tag: latest
  pullPolicy: IfNotPresent
  codec: int8           # int8 | binary | rabitq | pq

replicas: 1        # SQLite/RWO volume — scale via sharding, not replicas

service:
  port: 8900
  type: ClusterIP

resources:
  requests: {cpu: 250m, memory: 256Mi}
  limits: {cpu: "1", memory: 1Gi}

persistence:
  enabled: true
  size: 10Gi
  storageClass: ""
  mountPath: /var/lib/context-m

security:
  encryptionAtRest: true
  piiMode: redact          # off | redact | block | tag
  auditMode: security      # security | all | none
  # provide via --set secrets.masterKey=... or an existing secret
  existingSecret: ""
  masterKey: ""            # ignored when existingSecret is set

probe:
  readiness: /readyz
  liveness: /healthz

metrics:
  enabled: true            # Prometheus scrape annotations

snapshot:
  enabled: true
  schedule: "17 2 * * *"

# Nightly consolidate — FadeMem sweep + TMT hierarchy build.
# Measured 43.2% storage reduction with zero retrieval-precision
# regression (benchmarks/results/final.json). On by default; flips
# Config.fade_enabled and Config.tmt_enabled for the batch process
# via CONTEXT_M_FADE / CONTEXT_M_TMT env vars.
consolidate:
  enabled: true
  schedule: "31 3 * * *"   # 03:31 UTC, after snapshot
