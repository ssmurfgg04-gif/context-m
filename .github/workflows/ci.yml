name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # NB: pip exits 0 on unknown extras — must use extras that exist
          pip install -e ".[test,crypto,blake3]"
      - name: Unit + integration tests (pure-Python paths)
        run: python -m pytest tests/ -q

  rust-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install maturin + build wheels
        run: |
          python -m pip install --upgrade pip maturin
          (cd rust/cortexm-core && maturin build --release)
          (cd rust/quadrant && maturin build --release)
          pip install rust/target/wheels/cortexm_core-*.whl rust/target/wheels/quadrant-*.whl
      - name: Install package
        run: pip install -e ".[test,crypto,blake3]"
      - name: Parity + full suite with Rust acceleration active
        env:
          CONTEXTM_RUST: "1"
        run: python -m pytest tests/ -q
