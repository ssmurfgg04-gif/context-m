# PyPI release — trusted publishing (OIDC, no API token).
#
# Triggered by any `v*` tag push. Builds sdist + wheel, publishes
# to PyPI via the pypa/gh-action-pypi-publish action using the
# Trusted Publisher flow (https://docs.pypi.org/trusted-publishers/).
#
# SETUP (one time, on the PyPI side):
#   1. Sign in to https://pypi.org as the cortexm project owner.
#   2. Account settings → "Publishing" → "Add a new publisher".
#      - PyPI Project Name: cortexm
#      - Owner: ssmurfgg04-gif
#      - Repository name: context-m
#      - Workflow name: release.yml
#      - Environment name: release  (matches `environment:` below)
#
# After that, `git tag v0.5.0 && git push origin v0.5.0` →
# GHA auto-publishes. No PYPI_TOKEN secret required.

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write  # required for trusted publishing

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Verify the version matches the tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(python -c "import tomllib,sys; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag version: $TAG"
          echo "pyproject version: $PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $TAG does not match pyproject.toml version $PKG"
            exit 1
          fi
      - name: Quick smoke — import the built wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --no-index --find-links dist/ cortexm
          /tmp/smoke/bin/python -c "import cortexm; print('cortexm', cortexm.__version__); print('LLM_CALLS=', cortexm.LLM_CALLS)"
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release  # matches the trusted-publisher config on PyPI
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
